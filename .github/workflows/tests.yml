name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aquarag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aquarag_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - run: pytest -q

  # Only on a push to main, and only if the tests passed: build the API image and
  # publish it as ghcr.io/mahesh3494/aquarag. AquaManage's compose downloads it.
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN may read the code and write packages (the image), nothing else.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Log in with the token GitHub gives every run: no secret to set up.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: `latest` (what compose pulls) and `sha-<commit>` (a fixed version).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mahesh3494/aquarag
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/setup-buildx-action@v4

      # The cache keeps the big unchanged layers (torch, the two models) between
      # runs, so only a code change gets rebuilt.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
